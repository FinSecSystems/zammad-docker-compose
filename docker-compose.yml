# Zammad 7.2.x on the current upstream layout (zammad/zammad-docker-compose v17.x): ghcr.io/zammad/zammad image
# with PostgreSQL 17, Redis, memcached and Elasticsearch 9. Upgraded from 5.2.3 on 2026-11-22 (issue #119).
# The old PostgreSQL 9.6 data ($DB_DIR/zammad/postgresql), the old /opt/zammad tree ($BUILD_DIR/helpdesk/zammad) and the
# Elasticsearch 7 data ($BUILD_DIR/zammad/elasticsearch) are kept for rollback and removed after the check period.

x-zammad: &zammad-service
  image: ghcr.io/zammad/zammad:7.2.3
  init: true
  dns: ${DNS_IP_INTERNAL}
  restart: ${RESTART}
  env_file:
    - ./helpdesk.env                    # POSTGRESQL_PASS
  environment: &zammad-env
    MEMCACHE_SERVERS: zammad-memcached:11211
    POSTGRESQL_HOST: zammad-postgresql
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_USER: zammad
    POSTGRESQL_DB: zammad_production
    POSTGRESQL_DB_CREATE: "false"
    POSTGRESQL_OPTIONS: "?pool=50"
    REDIS_URL: redis://zammad-redis:6379
    ELASTICSEARCH_ENABLED: "true"
    ELASTICSEARCH_SCHEMA: http
    ELASTICSEARCH_HOST: zammad-elasticsearch
    ELASTICSEARCH_PORT: "9200"
    BACKUP_DIR: /var/tmp/zammad
    BACKUP_TIME: "03:00"
    HOLD_DAYS: "10"
    TZ: Europe/Berlin
  volumes:
    - ${BUILD_DIR}/helpdesk/storage:/opt/zammad/storage     # attachments are stored in the database; this holds the rest
    - ${DATA_DIR}/zammad/backup:/var/tmp/zammad:ro          # needed for waiting on restore operations
  external_links:
    - operations:dns

services:

  backup:
    <<: *zammad-service
    container_name: helpdesk-backup
    command: ["zammad-backup"]
    user: 0:0
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ${BUILD_DIR}/helpdesk/storage:/opt/zammad/storage
      - ${DATA_DIR}/zammad/backup:/var/tmp/zammad
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.2
        aliases:
          - zammad-backup

  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: helpdesk-elasticsearch
    mem_limit: 1536m                   # hard cap: without it the JVM sized its heap from the 62 GB host and was OOM-killed at 17 GB (2026-11-05)
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # the index is about 36 MB
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    restart: ${RESTART}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ${BUILD_DIR}/zammad/elasticsearch9:/usr/share/elasticsearch/data:rw
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.3
        aliases:
          - zammad-elasticsearch

  init:
    <<: *zammad-service
    container_name: helpdesk-init
    command: ["zammad-init"]
    user: 0:0
    restart: on-failure
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy
    volumes:
      - ${BUILD_DIR}/helpdesk/storage:/opt/zammad/storage
      - ${DATA_DIR}/zammad/backup:/var/tmp/zammad:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.4
        aliases:
          - zammad-init

  memcached:
    image: memcached:1.6.9-alpine
    container_name: helpdesk-memcached
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    command: memcached -m 256M
    restart: ${RESTART}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.5
        aliases:
          - zammad-memcached

  nginx:
    <<: *zammad-service
    container_name: helpdesk-nginx
    command: ["zammad-nginx"]
    init: false
    depends_on:
      railsserver:
        condition: service_healthy
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.6
        aliases:
          - zammad-nginx

  postgresql:
    image: postgres:17.12-alpine       # was 9.6; data dir is new, the 9.6 one is kept for rollback
    container_name: helpdesk-postgresql
    external_links:
      - operations:dns
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    shm_size: 64mb
    env_file:
      - ./helpdesk.env                 # POSTGRES_USER=zammad, POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: zammad_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad -d zammad_production"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 5
    volumes:
      - ${DB_DIR}/zammad/postgresql17:/var/lib/postgresql/data
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.7
        aliases:
          - zammad-postgresql

  railsserver:
    <<: *zammad-service
    container_name: helpdesk-railsserver
    command: ["zammad-railsserver"]
    depends_on:
      postgresql:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 300s
      timeout: 120s
      start_period: 120s
      retries: 5
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.8
        aliases:
          - zammad-railsserver

  redis:
    image: redis:7.4.3
    container_name: helpdesk-redis
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    command: ["redis-server", "--save", ""]   # websocket sessions only, nothing to keep
    restart: ${RESTART}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.15
        aliases:
          - zammad-redis

  scheduler:
    <<: *zammad-service
    container_name: helpdesk-scheduler
    command: ["zammad-scheduler"]
    depends_on:
      railsserver:
        condition: service_healthy
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.9
        aliases:
          - zammad-scheduler

  websocket:
    <<: *zammad-service
    container_name: helpdesk-websocket
    command: ["zammad-websocket"]
    depends_on:
      railsserver:
        condition: service_healthy
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.10
        aliases:
          - zammad-websocket

  app-proxy:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: helpdesk-app-proxy
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
      - operations:container-registry
      - operations:proxy
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://helpdesk-app-proxy"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: helpdesk.finsec.systems
    volumes:
      - ./app-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.11

  app-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: helpdesk-app-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
      - operations:container-registry
      - operations:proxy
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://helpdesk-app-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: helpdesk.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./app-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.12

  pgadmin:
    image: dpage/pgadmin4:9.18.0   # pinned tag, same in every stack (issue #7; was a digest of 9.17 / 8.6 in penpot)
    container_name: helpdesk-pgadmin
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    restart: ${RESTART}
    depends_on:
      - postgresql
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://helpdesk-pgadmin"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    user: 5050:5050
    volumes:
      - ${DATA_DIR}/zammad/pgadmin:/var/lib/pgadmin:rw
      - ../common/ca-bundle.pem:/ca-bundle.pem:ro   # system roots + internal root CA for the OIDC discovery
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /var/lib/pgadmin/sessions:uid=5050,gid=5050
    env_file:
      - ./helpdesk.env
      - ../common/pgadmin.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.13

  pgadmin-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: helpdesk-pgadmin-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
      - operations:proxy
      - operations:container-registry
    depends_on:
      - pgadmin
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://helpdesk-pgadmin-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: helpdeskdb.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./pgadmin-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.12.14

networks:
  operations_intranet:
    external: true
